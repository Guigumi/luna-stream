[workspace]
resolver = "3"
members = [
    "crates/luna-stream-proto",
    "crates/luna-streamd",
    "crates/luna-streamctl",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Luna GG <suporte@lunagg.com.br>"]
repository = "https://github.com/Guigumi/luna-stream"

[workspace.dependencies]
luna-stream-proto = { path = "crates/luna-stream-proto" }
luna-streamd = { path = "crates/luna-streamd" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ashpd = { version = "0.10", default-features = false, features = ["tokio"] }
gstreamer = { version = "0.23", features = ["v1_24"] }
gstreamer-app = { version = "0.23", features = ["v1_24"] }
gstreamer-video = { version = "0.23", features = ["v1_24"] }
gstreamer-pbutils = { version = "0.23", features = ["v1_24"] }
futures-util = "0.3"
tempfile = "3.17"
nix = { version = "0.29", features = ["signal", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
